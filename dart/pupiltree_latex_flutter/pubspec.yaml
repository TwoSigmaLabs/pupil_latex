name: pupiltree_latex_flutter
description: Flutter adapter for pupiltree_latex - the MathText widget (gpt_markdown + flutter_math_fork) every Pupiltree app renders math text with.
version: 1.1.0
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  # >= 1.3.0: inlinePatterns are masked before the plusparse parser runs,
  # which is what keeps emphasis out of `\(…\)` (see inlineMathPattern).
  gpt_markdown: ^1.3.0
  pupiltree_latex:
    path: ../pupiltree_latex

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
