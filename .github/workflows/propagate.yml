# Open a "chore: bump pupiltree-latex to vX.Y.Z" pull request in every consumer
# repository that already pins this library.
#
# Runs when a release is published, when ci.yml finishes a tag release
# (workflow_call: a release made with GITHUB_TOKEN does not fire
# `release: published`), or by hand (Actions → propagate → Run workflow).
#
# Secret PUPIL_LATEX_BUMP_TOKEN (required): a token that can push a branch and
# open a pull request in the consumers: a fine-grained PAT or GitHub App token
# with "Contents: read and write" and "Pull requests: read and write" on
# TwoSigmaLabs/Backend, pupiltree-agents, script_editor,
# pupiltree.ai_tutor-frontend, pupil-assessment-ui and Fillers. A fine-grained
# PAT or App installation token covers one owner only, so
# pupiltree/worksheet.ai reads PUPIL_LATEX_BUMP_TOKEN_PUPILTREE (same
# permissions on that repo) and falls back to PUPIL_LATEX_BUMP_TOKEN, which is
# enough when that token is a classic PAT or a machine user's token with access
# to both owners. A missing token fails the job; it never passes silently.
#
# The rewriting is tools/bump_consumer.py (tested in ci.yml). A consumer with
# no pupiltree-latex reference yet is skipped. Lock files: package-lock.json is
# refreshed with `npm install --package-lock-only` and pubspec.lock with
# `flutter pub get`; when that fails, the pull request says so and the
# consumer's CI or a developer refreshes it.

name: propagate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to propagate (X.Y.Z or vX.Y.Z); the release must exist"
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  LIBRARY_REPO: TwoSigmaLabs/pupil_latex

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ready: ${{ steps.v.outputs.ready }}
    steps:
      - name: version and release assets
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RAW: ${{ inputs.version || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          v="${RAW#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW' is not a release version (X.Y.Z)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "release" ] && [ "$PRERELEASE" = "true" ]; then
            echo "::notice::v$v is a prerelease; consumers are not bumped"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          assets=$(gh release view "v$v" -R "$LIBRARY_REPO" --json assets -q '.assets[].name' || true)
          missing=""
          for a in "pupiltree_latex-$v-py3-none-any.whl" "pupiltree-latex-$v.tgz" "pupiltree-latex.iife.js"; do
            grep -qxF "$a" <<<"$assets" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            if [ "$EVENT" = "release" ]; then
              # ci.yml uploads the assets after the tag and then calls this workflow itself.
              echo "::notice::release v$v has no$missing yet; ci.yml propagates once it has uploaded them"
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::release v$v is missing assets:$missing"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  bump:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              repo: TwoSigmaLabs/Backend,
              base: develop,
              kinds: python,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: TwoSigmaLabs/pupiltree-agents,
              base: develop,
              kinds: python,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: TwoSigmaLabs/script_editor,
              base: develop,
              kinds: flutter,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: TwoSigmaLabs/pupiltree.ai_tutor-frontend,
              base: develop,
              kinds: flutter,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: TwoSigmaLabs/pupil-assessment-ui,
              base: develop,
              kinds: js,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: TwoSigmaLabs/Fillers,
              base: develop,
              kinds: fillers,
              secret: PUPIL_LATEX_BUMP_TOKEN,
            }
          - {
              repo: pupiltree/worksheet.ai,
              base: main,
              kinds: "python,js",
              secret: PUPIL_LATEX_BUMP_TOKEN_PUPILTREE,
            }
    concurrency:
      group: propagate-${{ matrix.repo }}-${{ needs.resolve.outputs.version }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      BRANCH: chore/pupiltree-latex-v${{ needs.resolve.outputs.version }}
      GH_TOKEN: ${{ secrets[matrix.secret] || secrets.PUPIL_LATEX_BUMP_TOKEN }}
    steps:
      - name: token present
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret ${{ matrix.secret }} (or PUPIL_LATEX_BUMP_TOKEN) is not set; it needs contents and pull-requests write on ${{ matrix.repo }}. See the header of .github/workflows/propagate.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBRARY_REPO }}
          ref: v${{ env.VERSION }}
          path: library

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          token: ${{ env.GH_TOKEN }}
          path: consumer

      - name: download the IIFE bundle
        if: contains(matrix.kinds, 'fillers')
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pupiltree-latex.iife.js" \
            "https://github.com/$LIBRARY_REPO/releases/download/v$VERSION/pupiltree-latex.iife.js"

      - name: rewrite the pin
        id: bump
        run: |
          iife=()
          [ -f "$RUNNER_TEMP/pupiltree-latex.iife.js" ] && iife=(--iife "$RUNNER_TEMP/pupiltree-latex.iife.js")
          python library/tools/bump_consumer.py bump --repo-dir consumer --kinds "${{ matrix.kinds }}" \
            --version "$VERSION" "${iife[@]}" --json-out "$RUNNER_TEMP/bump.json" --github-output "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/notes.txt"

      - uses: actions/setup-node@v4
        if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.npm_dirs != '[]'
        with:
          node-version: 22

      - name: refresh package-lock.json
        if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.npm_dirs != '[]'
        env:
          DIRS: ${{ steps.bump.outputs.npm_dirs }}
        run: |
          for d in $(python -c 'import json,os;print(" ".join(json.loads(os.environ["DIRS"])))'); do
            [ -f "consumer/$d/package-lock.json" ] || continue
            if ! (cd "consumer/$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); then
              echo "\`$d/package-lock.json\` could not be refreshed here; run \`npm install\` in \`$d\` and commit the lock file." >> "$RUNNER_TEMP/notes.txt"
            fi
          done

      - uses: subosito/flutter-action@v2
        if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.pubspec_dirs != '[]'
        with:
          channel: stable

      - name: refresh pubspec.lock
        if: steps.bump.outputs.changed == 'true' && steps.bump.outputs.pubspec_dirs != '[]'
        env:
          DIRS: ${{ steps.bump.outputs.pubspec_dirs }}
        run: |
          for d in $(python -c 'import json,os;print(" ".join(json.loads(os.environ["DIRS"])))'); do
            if ! (cd "consumer/$d" && flutter pub get); then
              echo "\`$d/pubspec.lock\` could not be refreshed here (Flutter SDK or private dependency); run \`flutter pub get\` in \`$d\` and commit the lock file." >> "$RUNNER_TEMP/notes.txt"
            fi
          done

      - name: commit, push and open the pull request
        if: steps.bump.outputs.changed == 'true'
        working-directory: consumer
        run: |
          notes=()
          while IFS= read -r n; do [ -n "$n" ] && notes+=(--note "$n"); done < "$RUNNER_TEMP/notes.txt"
          python ../library/tools/bump_consumer.py pr-body --version "$VERSION" \
            --result "$RUNNER_TEMP/bump.json" --changelog ../library/CHANGELOG.md "${notes[@]}" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          { printf 'chore: bump pupiltree-latex to v%s\n\n' "$VERSION"; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/commit.txt"
          git commit -F "$RUNNER_TEMP/commit.txt"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          existing=$(gh pr list -R "${{ matrix.repo }}" --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$existing" ]; then
            echo "::notice::pull request already open, branch updated: $existing"
          else
            gh pr create -R "${{ matrix.repo }}" --base "${{ matrix.base }}" --head "$BRANCH" \
              --title "chore: bump pupiltree-latex to v$VERSION" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: nothing to bump
        if: steps.bump.outputs.changed != 'true'
        run: echo "::notice::${{ matrix.repo }} has no pupiltree-latex pin to move to v$VERSION (references found ${{ steps.bump.outputs.references }}); skipped"
